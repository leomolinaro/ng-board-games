<div class="page-content">
  <aside [tuiNavigationAside]="true">
    <div class="aside-header">
      @if (loading()) {
      <progress tuiProgressBar></progress>
      }
      <strong tuiTitle>Draft Generator</strong>
    </div>
    <div class="aside-scroll">
      <div class="settings-section">
        <label class="slider-field">
          <span>{{ nCards }} cards</span>
          <input
            tuiSlider
            type="range"
            min="0"
            max="80"
            step="1"
            [(ngModel)]="nCards" />
        </label>
        <label class="settings-checkbox">
          <input
            tuiCheckbox
            data-size="s"
            type="checkbox"
            [(ngModel)]="duplicates" />
          <span>Allow duplicates</span>
        </label>
      </div>

      <tui-accordion
        class="accordion"
        [closeOthers]="false"
        size="m">
        <button
          tuiAccordion
          tuiButton
          type="button">
          <span tuiTitle="s">Types</span>
        </button>
        <tui-expand>
          <agot-checkbox-list
            [items]="types()"
            [selected]="selectedTypeIds"
            (selectedChange)="selectedTypeIds = $event" />
        </tui-expand>

        <button
          tuiAccordion
          tuiButton
          type="button">
          <span tuiTitle="s">Factions</span>
        </button>
        <tui-expand>
          <agot-checkbox-list
            [items]="factions()"
            [selected]="selectedFactionIds"
            (selectedChange)="selectedFactionIds = $any($event)" />
        </tui-expand>

        <button
          tuiAccordion
          tuiButton
          type="button">
          <span tuiTitle="s">Packs</span>
        </button>
        <tui-expand>
          <agot-checkbox-list
            [items]="packs()"
            [selected]="selectedPackIds"
            (selectedChange)="selectedPackIds = $any($event)" />
        </tui-expand>
      </tui-accordion>
    </div>

    <div class="aside-footer">
      <button
        tuiButton
        type="button"
        appearance="primary"
        (click)="generate()">
        Generate
      </button>
    </div>
  </aside>
  <main tuiNavigationMain>
    <agot-card-grid [cards]="draftCards"></agot-card-grid>
  </main>
</div>
